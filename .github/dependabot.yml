version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'

  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'monthly'
    ignore:
      # typescript-eslint only supports TypeScript below 6.1, and with 7.0 `bun run lint`
      # crashes in @typescript-eslint/typescript-estree. Lift this once typescript-eslint
      # supports TypeScript 7.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      npm-dependencies:
        patterns:
          - '*'
